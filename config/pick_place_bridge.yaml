- ros_topic_name: /clock
  gz_topic_name: /world/gp7_world/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /gp7/gripper/attach
  gz_topic_name: /gp7/gripper/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: ignition.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /gp7/gripper/detach
  gz_topic_name: /gp7/gripper/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: ignition.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /gp7/gripper/state
  gz_topic_name: /gp7/gripper/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: ignition.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /gp7/box_b_pose
  gz_topic_name: /model/box_b/pose
  ros_type_name: geometry_msgs/msg/Pose
  gz_type_name: ignition.msgs.Pose
  direction: GZ_TO_ROS
# Fortress packages differ in whether PosePublisher includes the world scope.
# Both are receive-only; whichever topic exists supplies the same ROS stream.
- ros_topic_name: /gp7/box_b_pose
  gz_topic_name: /world/gp7_world/model/box_b/pose
  ros_type_name: geometry_msgs/msg/Pose
  gz_type_name: ignition.msgs.Pose
  direction: GZ_TO_ROS
